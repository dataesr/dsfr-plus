name: Publish package to Npmjs and notify on Mattermost

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

env:
  DEPLOYMENT_URL: https://www.npmjs.com/package/@dataesr/dsfr-plus
  MM_NOTIFICATION_CHANNEL: bots

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v7
      # No NPM_TOKEN: auth is done through OIDC, see the trusted publisher
      # configured on npmjs.com for @dataesr/dsfr-plus.
      - uses: actions/setup-node@v7
        with:
          # Trusted publishing needs Node >= 22.14 and npm >= 11.5.1
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false # never cache in release builds
      - run: npm ci
      - run: npm run build
      - run: npm publish

  release:
    name: Create new Github release
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write
    steps:
      - name: 🏁 Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🏷️ Get tag
        id: tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create changelog text
        id: changelog
        uses: loopwerk/tag-changelog@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config_file: .github/config/changelog.cjs

      - name: 📦 Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.tag.outputs.tag }}
          body: ${{ steps.changelog.outputs.changes }}

  notify:
    needs:
      - publish
      - release
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: dataesr/mm-notifier-action@v1.0.3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN}}
          mattermost_webhook_url: ${{ secrets.MATTERMOST_WEBHOOK_URL }}
          mattermost_channel: ${{ env.MM_NOTIFICATION_CHANNEL}}
          deployment_url: ${{ env.DEPLOYMENT_URL }}
